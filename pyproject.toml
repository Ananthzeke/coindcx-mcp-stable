[project]
name = "coindcx-mcp"
version = "0.2.0"
description = "MCP server for CoinDCX API integration"
authors = [
    {name = "Biswajit Kumar", email = "bksinha4497@gmail.com.com"}
]
requires-python = ">=3.10"
dependencies = [
    "mcp==2.2.0",
    "anyio>=4.15,<5",
    "httpx>=0.28.1,<0.29",
    "jsonschema>=4.26,<5",
    "python-dotenv>=1.2.1,<2",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coindcx_mcp"]

[project.scripts]
coindcx-mcp = "coindcx_mcp.server:main"
coindcx-paper-agent = "coindcx_mcp.paper_agent:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.15,<0.16"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
